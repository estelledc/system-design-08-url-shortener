services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
